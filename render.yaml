services:
  # ==========================================
  # ZOMP-API  —  Backend Node.js (API)
  # ==========================================
  - type: web
    name: zomp-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        value: postgresql://zomp_user:8yv530quG8LpXypejVO0UDmiwVovjOnW@dpg-d8guds48aovs73efq1a0-a.oregon-postgres.render.com/zomp_f1dk
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: leandro2703palmeira@gmail.com
      - key: ADMIN_PASSWORD
        value: Lps27031981@
      - key: ADMIN_NAME
        value: Leandro Palmeira

  # ==========================================
  # ZOMP-APP  —  Site Principal (Landing Page + SPA completa)
  # URL: https://zomp-app.onrender.com
  # ==========================================
  - type: web
    name: zomp-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://zomp-api.onrender.com/api

  # ==========================================
  # ZOMP-PASSAGEIRO  —  App do Passageiro (Redirect)
  # URL: https://zomp-passageiro.onrender.com
  #   -> Redireciona para zomp-app.onrender.com/passageiro
  # ==========================================
  - type: web
    name: zomp-passageiro
    runtime: static
    rootDir: redirects/passageiro
    buildCommand: echo "Redirect para App Passageiro"
    staticPublishPath: .

  # ==========================================
  # ZOMP-MOTORISTA  —  App do Motorista (Redirect)
  # URL: https://zomp-motorista.onrender.com
  #   -> Redireciona para zomp-app.onrender.com/motorista
  # ==========================================
  - type: web
    name: zomp-motorista
    runtime: static
    rootDir: redirects/motorista
    buildCommand: echo "Redirect para App Motorista"
    staticPublishPath: .

  # ==========================================
  # ZOMP-ADMIN  —  Painel Administrativo (Redirect)
  # URL: https://zomp-admin.onrender.com
  #   -> Redireciona para zomp-app.onrender.com/admin/login
  # ==========================================
  - type: web
    name: zomp-admin
    runtime: static
    rootDir: redirects/admin
    buildCommand: echo "Redirect para Painel Admin"
    staticPublishPath: .

databases:
  - name: zomp-db
    plan: free
