services:
  - type: web
    name: zomp-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        value: postgresql://zomp_db_whts_user:dsarX2dGuByNZah1tKMzrTb2bpcrEnsZ@dpg-d9njj3daeets73c365d0-a.oregon-postgres.render.com/zomp_db_whts
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: leandro2703palmeira@gmail.com
      - key: ADMIN_PASSWORD
        value: Lps27031981@
      - key: ADMIN_NAME
        value: Leandro Palmeira

  - type: web
    name: zomp-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://zomp-api.onrender.com/api

  - type: web
    name: zomp-passageiro
    runtime: static
    rootDir: redirects/passageiro
    staticPublishPath: .

  - type: web
    name: zomp-motorista
    runtime: static
    rootDir: redirects/motorista
    staticPublishPath: .

  - type: web
    name: zomp-admin
    runtime: static
    rootDir: redirects/admin
    staticPublishPath: .

databases:
  - name: zomp-db
    plan: free
